<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A minimalist to-do list built with HTML, CSS and JavaScript.">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">

        <header class="intro">
            <p class="eyebrow">Tasks</p>
            <h1>To-Do List</h1>
            <p class="subtitle">Organize your tasks and stay productive.</p>
        </header>

        <section class="card" aria-label="Task manager">

            <!-- Add / Edit -->
            <form id="todo-form" class="todo-form">
                <label for="todo-input" class="sr-only">Enter a task</label>
                <input
                    type="text"
                    id="todo-input"
                    placeholder="Add a new task…"
                    autocomplete="off"
                    maxlength="200"
                    required
                >
                <button type="submit" id="submit-btn" class="primary-btn">Add</button>
            </form>

            <!-- Filters -->
            <div class="filters" role="group" aria-label="Task filters">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- List -->
            <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

            <p id="empty-message" class="empty-message">No tasks yet. Add your first one above.</p>

            <!-- Footer -->
            <div class="todo-footer">
                <span id="task-count">0 active tasks</span>
                <button type="button" id="clear-completed" class="ghost-btn">Clear completed</button>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

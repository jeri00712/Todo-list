<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An elegant to-do list built with HTML, CSS and JavaScript.">
    <meta name="theme-color" content="#0b0b14">
    <title>To-Do List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animated background -->
    <div class="bg" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <canvas id="confetti" aria-hidden="true"></canvas>

    <main class="app">

        <header class="intro">
            <p class="eyebrow" id="greeting">Today</p>
            <h1>My <span>Tasks</span></h1>
            <p class="subtitle">Organize your day and stay productive.</p>
        </header>

        <section class="card" aria-label="Task manager">

            <!-- Progress -->
            <div class="progress">
                <div class="progress-top">
                    <span id="progress-text">0 of 0 done</span>
                    <strong id="progress-percent">0%</strong>
                </div>
                <div class="bar"><span id="progress-fill"></span></div>
            </div>

            <!-- Add / Edit -->
            <form id="todo-form" class="todo-form">
                <label for="todo-input" class="sr-only">Enter a task</label>
                <input
                    type="text"
                    id="todo-input"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                    maxlength="200"
                    required
                >
                <button type="submit" id="submit-btn" class="primary-btn">Add</button>
            </form>

            <!-- Filters -->
            <div class="filters" role="group" aria-label="Task filters">
                <span class="filter-pill" aria-hidden="true"></span>
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- List -->
            <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

            <div id="empty-message" class="empty-message">
                <span class="empty-icon">✨</span>
                <p id="empty-text">No tasks yet. Add your first one above.</p>
            </div>

            <!-- Footer -->
            <div class="todo-footer">
                <span id="task-count">0 active tasks</span>
                <button type="button" id="clear-completed" class="ghost-btn">Clear completed</button>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

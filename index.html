<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="JavaScript To-Do List application by Jeri C."
    >

    <meta
        name="author"
        content="Jeri C"
    >

    <title>My To-Do List | Jeri C</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <div class="nav-container">

            <a
                href="../index.html"
                class="logo"
                aria-label="Jeri C Home"
            >
                Jeri C
            </a>

            <nav
                class="main-nav"
                aria-label="Main navigation"
            >

                <ul class="nav-list">

                    <li>
                        <a href="../index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="../about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a
                            href="../projects.html"
                            class="active"
                            aria-current="page"
                        >
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="../contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- Main Content -->
    <main>

        <section
            class="todo-section"
            aria-labelledby="todo-title"
        >

            <div class="todo-container">

                <!-- Introduction -->
                <div class="todo-intro">

                    <h1 id="todo-title">
                        My To-Do List
                    </h1>

                    <p>
                        Organize your tasks and stay productive.
                    </p>

                </div>


                <!-- To-Do Application -->
                <div class="todo-card">

                    <h2>
                        Task Manager
                    </h2>


                    <!-- Add / Edit Task -->
                    <form
                        id="todo-form"
                        class="todo-form"
                    >

                        <label
                            for="todo-input"
                            class="sr-only"
                        >
                            Enter a task
                        </label>

                        <input
                            type="text"
                            id="todo-input"
                            placeholder="Enter a new task..."
                            autocomplete="off"
                            maxlength="200"
                            required
                        >

                        <button
                            type="submit"
                            id="submit-btn"
                            class="primary-btn"
                        >
                            Add Task
                        </button>

                    </form>


                    <!-- Filters -->
                    <div
                        class="filters"
                        role="group"
                        aria-label="Task filters"
                    >

                        <button
                            type="button"
                            class="filter-btn active"
                            data-filter="all"
                        >
                            All
                        </button>

                        <button
                            type="button"
                            class="filter-btn"
                            data-filter="active"
                        >
                            Active
                        </button>

                        <button
                            type="button"
                            class="filter-btn"
                            data-filter="completed"
                        >
                            Completed
                        </button>

                    </div>


                    <!-- Task List -->
                    <ul
                        id="todo-list"
                        class="todo-list"
                        aria-live="polite"
                    >
                    </ul>


                    <!-- Empty State -->
                    <p
                        id="empty-message"
                        class="empty-message"
                    >
                        No tasks yet. Add your first task!
                    </p>


                    <!-- Task Footer -->
                    <div class="todo-footer">

                        <span id="task-count">
                            0 active tasks
                        </span>

                        <button
                            type="button"
                            id="clear-completed"
                            class="clear-btn"
                        >
                            Clear Completed
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="footer-container">

            <p>
                © 2026 Jeri C. All rights reserved.
            </p>

            <div class="footer-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="../projects.html">
                    Projects
                </a>

                <a href="../contact.html">
                    Contact
                </a>

            </div>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
